<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div class="headerTop">
        <div class="brand">
          <img
            class="brandLogo"
            src="assets/tandem-favicon-32.png"
            alt="Tandem"
            onerror="this.style.display='none'"
          />
          <div class="brandText">
            <div class="title">Tandem</div>
            <div class="subtitle">active</div>
          </div>
        </div>
        <div class="runtimePill">running</div>
      </div>
      <div class="subtitle" id="pageTitle">No page captured yet</div>
      <div class="subtitle" id="statusLine"></div>
    </header>

    <section class="card">
      <div class="row">
        <button id="newSession" class="btn danger">Clear context</button>
      </div>

      <div class="h1" style="margin-top: 10px;">Session Goal</div>
      <div class="row inputRow">
        <input id="goal" class="input" type="text" aria-label="Session Goal" placeholder="e.g. Create a new customer record" />
        <button id="explain" class="btn primary">Explain</button>
      </div>

      <div class="small" id="pageMeta"></div>
    </section>

    <section class="card">
      <div class="h2">Guidance</div>
      <div class="summary" id="summary"></div>
      <div class="question" id="clarifying"></div>

      <div class="stepsHeader">
        <div class="label">Steps</div>
        <div class="row">
          <button id="done" class="btn">Next step</button>
          <button id="endSession" class="btn danger">End session</button>
        </div>
      </div>

      <div id="thinking" class="thinking" style="display: none;">
        <div class="spinner" aria-hidden="true"></div>
        <div id="thinkingText" class="thinkingText">Thinking…</div>
      </div>
      <ol class="steps" id="steps"></ol>

      <div id="finalConfirm" class="finalConfirm" hidden>
        <div id="finalPrompt" class="finalPrompt">Do you still need my help?</div>
        <div class="row">
          <button id="finalYes" class="btn primary">Yes</button>
          <button id="finalNo" class="btn">No</button>
        </div>
      </div>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
