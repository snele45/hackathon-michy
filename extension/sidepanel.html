<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onboarding Buddy</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div class="title">Onboarding Buddy</div>
      <div class="subtitle" id="pageTitle">No page captured yet</div>
      <div class="subtitle" id="statusLine"></div>
    </header>

    <section class="card">
      <div class="row">
        <button id="capture" class="btn primary">Capture page context</button>
        <button id="explain" class="btn">Explain next step</button>
      </div>

      <label class="label" for="goal">Goal</label>
      <input id="goal" class="input" type="text" placeholder="e.g. Create a new customer record" />

      <div class="small" id="pageMeta"></div>
      <pre class="context" id="contextPreview"></pre>
    </section>

    <section class="card">
      <div class="label">Guidance</div>
      <div class="summary" id="summary"></div>
      <div class="question" id="clarifying"></div>

      <div class="stepsHeader">
        <div class="label">Steps</div>
        <div class="row">
          <button id="done" class="btn">Mark step done</button>
        </div>
      </div>
      <ol class="steps" id="steps"></ol>

      <div class="label">Current step help</div>
      <div class="help" id="currentHelp"></div>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
